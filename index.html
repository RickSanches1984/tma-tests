<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TMA Tests</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #111);
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p.sub { opacity: .7; margin: 0 0 24px; font-size: 14px; }
  a.card {
    display: block;
    padding: 16px;
    margin-bottom: 12px;
    border-radius: 12px;
    text-decoration: none;
    background: var(--tg-theme-secondary-bg-color, #f2f2f2);
    color: var(--tg-theme-text-color, #111);
  }
  a.card b { display: block; font-size: 16px; margin-bottom: 4px; }
  a.card span { font-size: 13px; opacity: .7; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TMA Tests</h1>
  <p class="sub">Песочница для Telegram Mini Apps на GitHub Pages</p>

  <a class="card" href="app1/">
    <b>App 1 — Тема</b>
    <span>Демо CSS-переменных темы Telegram + MainButton</span>
  </a>
  <a class="card" href="app2/">
    <b>App 2 — Пользователь и Haptic</b>
    <span>initDataUnsafe, haptic feedback, BackButton</span>
  </a>
</div>
<script>
  if (window.Telegram?.WebApp) Telegram.WebApp.ready();
</script>
</body>
</html>
